<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة الاتحاد - اللعبة التفاعلية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>لعبة رحلة الاتحاد</h1>
        <p id="score">النقاط: 0 / 6</p>

        <div class="question-box">
            <p id="question">سؤال اللعبة سيظهر هنا...</p>
        </div>

        <div class="options-grid" id="options-grid">
            <!-- خيارات الإجابة ستضاف هنا بواسطة JavaScript -->
        </div>

        <div id="result"></div>

        <button class="button" id="next-button" style="display: none;">السؤال التالي</button>
        <button class="button home-link" id="restart-button" style="display: none;">إعادة اللعبة</button>
        <a href="index.html" class="button home-link">العودة لصفحة المعلومات</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
